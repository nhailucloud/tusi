<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; font-src 'self'; img-src 'self' data:; connect-src 'self'; manifest-src 'self'; worker-src 'self'; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#0f1e24" id="theme-color">
<meta name="description" content="TUSI shows how much money you can use right now and how many days it lasts. Your data stays on your device.">
<title>TUSI</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="TUSI">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preload" href="outfit-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="manrope-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="app.css">
</head>
<body>
<a class="skip" href="#main">Skip to content</a>
<div class="app" id="app">
  <aside class="side" aria-label="Main">
    <div class="brandrow"><span class="mkc"><svg viewBox="0 0 64 64" aria-hidden="true"><use href="#tusi-mark"/></svg></span><b>TUSI</b></div>
    <nav class="side-nav" aria-label="Sections">
      <a class="navi" href="#home" data-nav="home"><svg aria-hidden="true"><use href="#i-home"/></svg>Home</a>
      <a class="navi" href="#plan" data-nav="plan"><svg aria-hidden="true"><use href="#i-plan"/></svg>Plan</a>
      <a class="navi" href="#log" data-nav="log"><svg aria-hidden="true"><use href="#i-log"/></svg>Log</a>
      <a class="navi" href="#more" data-nav="more"><svg aria-hidden="true"><use href="#i-more"/></svg>More</a>
    </nav>
    <div class="spacer"></div>
    <button class="btn primary wide-btn" type="button" data-action="log-purchase"><svg aria-hidden="true"><use href="#i-plus"/></svg>Log a purchase</button>
    <p class="side-note"><svg aria-hidden="true"><use href="#i-lock"/></svg><span>Your data stays on this device.</span></p>
  </aside>

  <main class="main" id="main" tabindex="-1">
    <div class="banner" id="storage-banner" hidden role="status"></div>
    <section class="view" id="view-home" data-view="home" aria-labelledby="home-title"></section>
    <section class="view" id="view-plan" data-view="plan" aria-labelledby="plan-title" hidden></section>
    <section class="view" id="view-log" data-view="log" aria-labelledby="log-title" hidden></section>
    <section class="view" id="view-more" data-view="more" aria-labelledby="more-title" hidden></section>
    <section class="view" id="view-setup" data-view="setup" aria-labelledby="setup-title" hidden></section>
  </main>

  <nav class="tabbar" aria-label="Sections">
    <a class="tab" href="#home" data-nav="home"><svg aria-hidden="true"><use href="#i-home"/></svg><span>Home</span></a>
    <a class="tab" href="#plan" data-nav="plan"><svg aria-hidden="true"><use href="#i-plan"/></svg><span>Plan</span></a>
    <button class="tab-add" type="button" data-action="log-purchase" aria-label="Log a purchase"><svg aria-hidden="true"><use href="#i-plus"/></svg></button>
    <a class="tab" href="#log" data-nav="log"><svg aria-hidden="true"><use href="#i-log"/></svg><span>Log</span></a>
    <a class="tab" href="#more" data-nav="more"><svg aria-hidden="true"><use href="#i-more"/></svg><span>More</span></a>
  </nav>
</div>

<dialog class="sheet" id="sheet" aria-labelledby="sheet-title"></dialog>
<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

<noscript><p class="noscript">TUSI needs JavaScript turned on. Nothing you enter is sent anywhere.</p></noscript>

<svg width="0" height="0" class="defs" aria-hidden="true">
  <defs>
    <symbol id="tusi-mark" viewBox="0 0 64 64">
      <circle cx="32" cy="15" r="6.5" class="mark-sun"/>
      <path d="M12 30 H52 M32 30 V52" class="mark-t"/>
    </symbol>
    <symbol id="i-home" viewBox="0 0 24 24"><path d="M4 11.5 12 5l8 6.5V19a1 1 0 0 1-1 1h-4v-5h-6v5H5a1 1 0 0 1-1-1z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></symbol>
    <symbol id="i-plan" viewBox="0 0 24 24"><rect x="4" y="5.5" width="16" height="14" rx="3" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M8 3.5v4M16 3.5v4M4 10h16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></symbol>
    <symbol id="i-log" viewBox="0 0 24 24"><path d="M8 7h11M8 12h11M8 17h11" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><circle cx="4.5" cy="7" r="1.2" fill="currentColor"/><circle cx="4.5" cy="12" r="1.2" fill="currentColor"/><circle cx="4.5" cy="17" r="1.2" fill="currentColor"/></symbol>
    <symbol id="i-more" viewBox="0 0 24 24"><circle cx="6" cy="12" r="1.7" fill="currentColor"/><circle cx="12" cy="12" r="1.7" fill="currentColor"/><circle cx="18" cy="12" r="1.7" fill="currentColor"/></symbol>
    <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><path d="M5 12.5l4 4 10-10" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-bulb" viewBox="0 0 24 24"><path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-3.5 10.9c.6.5 1 1.2 1 2.1h5c0-.9.4-1.6 1-2.1A6 6 0 0 0 12 3z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></symbol>
    <symbol id="i-lock" viewBox="0 0 24 24"><rect x="5" y="10.5" width="14" height="9.5" rx="2.5" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M8.5 10.5V8a3.5 3.5 0 0 1 7 0v2.5" fill="none" stroke="currentColor" stroke-width="1.8"/></symbol>
    <symbol id="i-close" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
    <symbol id="i-chev" viewBox="0 0 24 24"><path d="M9 6l6 6-6 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-heart" viewBox="0 0 24 24"><path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></symbol>
    <symbol id="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="9" r="3.2" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M3 16h18M7 20h10" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></symbol>
    <symbol id="i-cal" viewBox="0 0 24 24"><rect x="4" y="5.5" width="16" height="14" rx="3" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M8 3.5v4M16 3.5v4M4 10h16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><circle cx="12" cy="14.5" r="1.6" fill="currentColor"/></symbol>
    <symbol id="i-low" viewBox="0 0 24 24"><path d="M4 7l6 6 4-4 6 6M20 15v-5M20 15h-5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-bill" viewBox="0 0 24 24"><path d="M6 3h12v18l-3-2-3 2-3-2-3 2z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><path d="M9 8h6M9 12h6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></symbol>
    <symbol id="i-in" viewBox="0 0 24 24"><path d="M12 5v14M6 13l6 6 6-6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-bell" viewBox="0 0 24 24"><path d="M6 16V11a6 6 0 1 1 12 0v5l1.5 2h-15zM10 20.5h4" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"/></symbol>
    <symbol id="i-minus" viewBox="0 0 24 24"><path d="M5 12h14" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></symbol>
    <symbol id="i-scale" viewBox="0 0 24 24"><path d="M12 4v16M5 8h14M7 8l-3 7h6zM17 8l-3 7h6z" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/></symbol>
    <symbol id="i-bigcheck" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  </defs>
</svg>

<script src="engine.js"></script>
<script src="store.js"></script>
<script src="backup.js"></script>
<script src="app.js"></script>
</body>
</html>
